<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D 跑酷冒險 - 動態鏡頭版</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; touch-action: manipulation; font-family: sans-serif; }
    #ui { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 10; }
    .score-box { font-size: 22px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* 手機虛擬按鈕 */
    #controls { position: absolute; bottom: 25px; left: 0; width: 100%; display: flex; justify-content: space-evenly; padding: 0 10px; box-sizing: border-box; z-index: 10; }
    .btn { background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.5); color: white; padding: 16px 24px; border-radius: 50px; font-size: 20px; font-weight: bold; user-select: none; outline: none; }
    .btn:active { background: rgba(255, 255, 255, 0.6); transform: scale(0.95); }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div class="score-box">得分: <span id="score">0</span> | 金幣: <span id="coins">0</span></div>
  </div>

  <!-- 手機控制按鈕 -->
  <div id="controls">
    <button class="btn" id="btn-left">⬅️</button>
    <button class="btn" id="btn-jump">⬆️ 跳躍</button>
    <button class="btn" id="btn-right">➡️</button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // 1. 場景設定
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.Fog(0x0f172a, 10, 30);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // 鏡頭初始位置基準點
    const baseCamOffset = { x: 0, y: 3.5, z: 8 };
    camera.position.set(baseCamOffset.x, baseCamOffset.y, baseCamOffset.z);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. 光源
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // 3. 跑道
    const LANES = [-2.5, 0, 2.5];
    let currentLane = 1;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 50),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.z = -10;
    scene.add(floor);

    // 4. 玩家
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
    );
    player.position.set(LANES[currentLane], 0.5, 3);
    scene.add(player);

    // 5. 動態生成障礙物與金幣
    const obstacles = [];
    const coins = [];

    function spawnEntity() {
      const lane = LANES[Math.floor(Math.random() * 3)];
      const isCoin = Math.random() > 0.5;

      if (isCoin) {
        const coin = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.4),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8 })
        );
        coin.position.set(lane, 0.6, -25);
        scene.add(coin);
        coins.push(coin);
      } else {
        const obstacle = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 1.2, 1.2),
          new THREE.MeshStandardMaterial({ color: 0xf43f5e })
        );
        obstacle.position.set(lane, 0.6, -25);
        scene.add(obstacle);
        obstacles.push(obstacle);
      }
    }

    setInterval(spawnEntity, 1200);

    // 遊戲狀態
    let isJumping = false;
    let jumpVelocity = 0;
    let score = 0;
    let coinCount = 0;
    let isGameOver = false;

    // 6. 操作邏輯
    function moveLeft() { if (currentLane > 0) currentLane--; }
    function moveRight() { if (currentLane < 2) currentLane++; }
    function jump() {
      if (!isJumping) {
        isJumping = true;
        jumpVelocity = 0.22;
      }
    }

    document.getElementById('btn-left').onclick = moveLeft;
    document.getElementById('btn-right').onclick = moveRight;
    document.getElementById('btn-jump').onclick = jump;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. 遊戲主循環
    function animate() {
      requestAnimationFrame(animate);

      if (!isGameOver) {
        // 玩家位置平滑更新 (Lerp)
        player.position.x += (LANES[currentLane] - player.position.x) * 0.2;

        // 跳躍物理
        if (isJumping) {
          player.position.y += jumpVelocity;
          jumpVelocity -= 0.012;
          if (player.position.y <= 0.5) {
            player.position.y = 0.5;
            isJumping = false;
          }
        }

        // ==========================================
        // 🎥 方案 A：動態跟隨鏡頭運鏡邏輯
        // ==========================================
        
        // 1. 鏡頭 X 軸延遲跟隨（只移動角色的 60%，產生側滑感）
        const targetCamX = player.position.x * 0.6;
        
        // 2. 跳躍時鏡頭跟著微幅升高
        const targetCamY = baseCamOffset.y + (player.position.y - 0.5) * 0.3;
        
        // 3. 鏡頭位置平滑內插 (Lerp)
        camera.position.x += (targetCamX - camera.position.x) * 0.1;
        camera.position.y += (targetCamY - camera.position.y) * 0.1;

        // 4. 側移動時產生微幅傾斜角度（Z 軸旋轉）
        const sideVelocity = LANES[currentLane] - player.position.x;
        const targetRollAngle = -sideVelocity * 0.05; // 傾斜幅度
        camera.rotation.z += (targetRollAngle - camera.rotation.z) * 0.1;

        // 5. 焦點始終注視著玩家前方一點點的位置
        camera.lookAt(player.position.x * 0.3, player.position.y + 0.3, 0);

        // ==========================================

        // 處理障礙物
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += 0.2;

          if (player.position.distanceTo(obs.position) < 0.9) {
            isGameOver = true;
            alert(`💥 遊戲結束！\n得分: ${score}\n獲得金幣: ${coinCount}`);
            location.reload();
          }

          if (obs.position.z > 8) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            score += 10;
            document.getElementById('score').innerText = score;
          }
        }

        // 處理金幣
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          c.position.z += 0.2;
          c.rotation.y += 0.05;

          if (player.position.distanceTo(c.position) < 1.0) {
            scene.remove(c);
            coins.splice(i, 1);
            coinCount += 1;
            score += 50;
            document.getElementById('coins').innerText = coinCount;
            document.getElementById('score').innerText = score;
          } else if (c.position.z > 8) {
            scene.remove(c);
            coins.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
  </html>
