<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>我的第一個 3D 手機小遊戲</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a2e; touch-action: manipulation; }
    #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 20px; pointer-events: none; }
  </style>

  <!-- 用 Import Map 讓瀏覽器直接從 CDN 載入 Three.js，完全不需要 npm -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui">得分: <span id="score">0</span><br><small style="font-size:14px; color:#aaa;">點擊螢幕跳躍躲避方塊</small></div>

  <script type="module">
    import * as THREE from 'three';

    // 1. 建立場景與相機
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. 光源
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(2, 5, 3);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    // 3. 地板
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 30),
      new THREE.MeshStandardMaterial({ color: 0x16213e })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // 4. 玩家方塊 (紅色)
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xe94560 })
    );
    player.position.set(0, 0.5, 1);
    scene.add(player);

    // 5. 障礙物方塊 (藍色)
    const obstacle = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x0f3460 })
    );
    obstacle.position.set(0, 0.5, -15);
    scene.add(obstacle);

    // 遊戲狀態與變數
    let isJumping = false;
    let jumpVelocity = 0;
    let score = 0;
    let isGameOver = false;

    // 點擊觸發跳躍
    window.addEventListener('pointerdown', () => {
      if (isGameOver) {
        // 重新開始
        obstacle.position.z = -15;
        score = 0;
        document.getElementById('score').innerText = score;
        isGameOver = false;
        return;
      }
      if (!isJumping) {
        isJumping = true;
        jumpVelocity = 0.18; // 跳躍初始速度
      }
    });

    // 畫面尺寸調整
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 遊戲主循環
    function animate() {
      requestAnimationFrame(animate);

      if (!isGameOver) {
        // 跳躍物理邏輯
        if (isJumping) {
          player.position.y += jumpVelocity;
          jumpVelocity -= 0.01; // 重力效果
          if (player.position.y <= 0.5) {
            player.position.y = 0.5;
            isJumping = false;
          }
        }

        // 障礙物向玩家移動
        obstacle.position.z += 0.12;
        if (obstacle.position.z > 4) {
          obstacle.position.z = -15;
          score++;
          document.getElementById('score').innerText = score;
        }

        // 碰撞偵測 (距離小於 0.8 算撞到)
        if (player.position.distanceTo(obstacle.position) < 0.8) {
          isGameOver = true;
          alert(`遊戲結束！最終得分：${score}\n點擊螢幕重新開始`);
        }
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
