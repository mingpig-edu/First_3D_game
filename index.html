<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D 跑酷冒險 - 特效與道具版</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; touch-action: manipulation; font-family: sans-serif; }
    #ui { position: absolute; top: 15px; left: 0; width: 100%; text-align: center; color: white; pointer-events: none; z-index: 10; }
    .score-box { font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    #status { margin-top: 6px; font-size: 14px; font-weight: bold; min-height: 20px; }
    .badge { padding: 3px 8px; border-radius: 12px; margin: 0 3px; display: inline-block; }
    .badge-shield { background: #06b6d4; color: #fff; }
    .badge-magnet { background: #a855f7; color: #fff; }
    
    /* 手機虛擬按鈕 */
    #controls { position: absolute; bottom: 25px; left: 0; width: 100%; display: flex; justify-content: space-evenly; padding: 0 10px; box-sizing: border-box; z-index: 10; }
    .btn { background: rgba(255, 255, 255, 0.25); border: 2px solid rgba(255, 255, 255, 0.5); color: white; padding: 16px 24px; border-radius: 50px; font-size: 20px; font-weight: bold; user-select: none; outline: none; }
    .btn:active { background: rgba(255, 255, 255, 0.6); transform: scale(0.95); }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <div class="score-box">得分: <span id="score">0</span> | 金幣: <span id="coins">0</span></div>
    <div id="status"></div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-left">⬅️</button>
    <button class="btn" id="btn-jump">⬆️ 跳躍</button>
    <button class="btn" id="btn-right">➡️</button>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // 1. 場景設定
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.Fog(0x0f172a, 10, 30);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const baseCamOffset = { x: 0, y: 3.5, z: 8 };
    camera.position.set(baseCamOffset.x, baseCamOffset.y, baseCamOffset.z);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 2. 光源
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(5, 10, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    // 3. 跑道
    const LANES = [-2.5, 0, 2.5];
    let currentLane = 1;

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 50),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.z = -10;
    scene.add(floor);

    // 4. 玩家與護盾特效網格
    const player = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
    );
    player.position.set(LANES[currentLane], 0.5, 3);
    scene.add(player);

    const shieldMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.8, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.45, wireframe: true })
    );
    shieldMesh.visible = false;
    player.add(shieldMesh);

    // 5. 遊戲實體陣列 (障礙物, 金幣, 道具, 粒子)
    const obstacles = [];
    const coins = [];
    const powerups = [];
    const particles = [];

    // 粒子爆裂生成器
    function createExplosion(pos, colorHex, count = 12) {
      const geom = new THREE.BoxGeometry(0.12, 0.12, 0.12);
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(geom, mat);
        p.position.copy(pos);
        p.userData = {
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 0.35,
            Math.random() * 0.3 + 0.1,
            (Math.random() - 0.5) * 0.35
          ),
          life: 1.0
        };
        scene.add(p);
        particles.push(p);
      }
    }

    // 畫面震動變數
    let shakeIntensity = 0;
    function triggerShake(intensity = 0.3) {
      shakeIntensity = intensity;
    }

    // 動態生成邏輯
    function spawnEntity() {
      const lane = LANES[Math.floor(Math.random() * 3)];
      const rand = Math.random();

      if (rand < 0.45) {
        // 生成金幣
        const coin = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.4),
          new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.8 })
        );
        coin.position.set(lane, 0.6, -25);
        scene.add(coin);
        coins.push(coin);
      } else if (rand < 0.85) {
        // 生成障礙物
        const obstacle = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, 1.2, 1.2),
          new THREE.MeshStandardMaterial({ color: 0xf43f5e })
        );
        obstacle.position.set(lane, 0.6, -25);
        scene.add(obstacle);
        obstacles.push(obstacle);
      } else {
        // 生成道具 (護盾 或 磁鐵)
        const isShield = Math.random() > 0.5;
        const pMesh = new THREE.Mesh(
          isShield ? new THREE.DodecahedronGeometry(0.4) : new THREE.TorusGeometry(0.3, 0.1, 8, 16),
          new THREE.MeshStandardMaterial({ color: isShield ? 0x06b6d4 : 0xa855f7, emissive: isShield ? 0x0284c7 : 0x7e22ce })
        );
        pMesh.position.set(lane, 0.6, -25);
        pMesh.userData = { type: isShield ? 'shield' : 'magnet' };
        scene.add(pMesh);
        powerups.push(pMesh);
      }
    }

    setInterval(spawnEntity, 1100);

    // 遊戲狀態與道具時效
    let isJumping = false;
    let jumpVelocity = 0;
    let score = 0;
    let coinCount = 0;
    let isGameOver = false;

    let hasShield = false;
    let magnetTimer = 0; // 磁鐵剩餘幀數

    // 操作邏輯
    function moveLeft() { if (currentLane > 0) currentLane--; }
    function moveRight() { if (currentLane < 2) currentLane++; }
    function jump() {
      if (!isJumping) {
        isJumping = true;
        jumpVelocity = 0.22;
      }
    }

    document.getElementById('btn-left').onclick = moveLeft;
    document.getElementById('btn-right').onclick = moveRight;
    document.getElementById('btn-jump').onclick = jump;

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 更新 UI 狀態顯示
    function updateUI() {
      document.getElementById('score').innerText = score;
      document.getElementById('coins').innerText = coinCount;
      
      let statusHTML = '';
      if (hasShield) statusHTML += '<span class="badge badge-shield">🛡️ 護盾中</span>';
      if (magnetTimer > 0) statusHTML += `<span class="badge badge-magnet">🧲 磁鐵 (${Math.ceil(magnetTimer / 60)}s)</span>`;
      document.getElementById('status').innerHTML = statusHTML;
    }

    // 7. 遊戲主循環
    function animate() {
      requestAnimationFrame(animate);

      if (!isGameOver) {
        // 平滑移動與跳躍
        player.position.x += (LANES[currentLane] - player.position.x) * 0.2;

        if (isJumping) {
          player.position.y += jumpVelocity;
          jumpVelocity -= 0.012;
          if (player.position.y <= 0.5) {
            player.position.y = 0.5;
            isJumping = false;
          }
        }

        // 磁鐵計時
        if (magnetTimer > 0) magnetTimer--;

        // 🎥 鏡頭追蹤與震動運算
        const targetCamX = player.position.x * 0.6;
        const targetCamY = baseCamOffset.y + (player.position.y - 0.5) * 0.3;
        
        camera.position.x += (targetCamX - camera.position.x) * 0.1;
        camera.position.y += (targetCamY - camera.position.y) * 0.1;

        // 套用震動偏移
        if (shakeIntensity > 0.005) {
          camera.position.x += (Math.random() - 0.5) * shakeIntensity;
          camera.position.y += (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity *= 0.88;
        }

        const sideVelocity = LANES[currentLane] - player.position.x;
        camera.rotation.z += (-sideVelocity * 0.05 - camera.rotation.z) * 0.1;
        camera.lookAt(player.position.x * 0.3, player.position.y + 0.3, 0);

        // 💥 粒子特效更新
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.position.add(p.userData.vel);
          p.userData.life -= 0.04;
          p.scale.multiplyScalar(0.92);
          if (p.userData.life <= 0) {
            scene.remove(p);
            particles.splice(i, 1);
          }
        }

        // 障礙物處理
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += 0.22;

          if (player.position.distanceTo(obs.position) < 0.9) {
            if (hasShield) {
              // 護盾抵擋傷害！
              hasShield = false;
              shieldMesh.visible = false;
              createExplosion(obs.position, 0x06b6d4, 15);
              triggerShake(0.3);
              scene.remove(obs);
              obstacles.splice(i, 1);
            } else {
              // Game Over 撞擊
              isGameOver = true;
              createExplosion(player.position, 0xf43f5e, 25);
              triggerShake(0.6);
              setTimeout(() => {
                alert(`💥 遊戲結束！\n最終得分: ${score}\n獲得金幣: ${coinCount}`);
                location.reload();
              }, 400);
            }
            continue;
          }

          if (obs.position.z > 8) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            score += 10;
          }
        }

        // 金幣處理 (含磁鐵吸附)
        for (let i = coins.length - 1; i >= 0; i--) {
          const c = coins[i];
          c.position.z += 0.22;
          c.rotation.y += 0.05;

          // 磁鐵吸附邏輯
          if (magnetTimer > 0 && c.position.distanceTo(player.position) < 8) {
            c.position.lerp(player.position, 0.18);
          }

          // 吃到金幣
          if (player.position.distanceTo(c.position) < 0.9) {
            createExplosion(c.position, 0xfacc15, 10);
            scene.remove(c);
            coins.splice(i, 1);
            coinCount += 1;
            score += 50;
          } else if (c.position.z > 8) {
            scene.remove(c);
            coins.splice(i, 1);
          }
        }

        // 道具處理
        for (let i = powerups.length - 1; i >= 0; i--) {
          const p = powerups[i];
          p.position.z += 0.22;
          p.rotation.y += 0.04;

          if (player.position.distanceTo(p.position) < 0.9) {
            if (p.userData.type === 'shield') {
              hasShield = true;
              shieldMesh.visible = true;
              createExplosion(p.position, 0x06b6d4, 12);
            } else if (p.userData.type === 'magnet') {
              magnetTimer = 300; // 5 秒 (60 FPS * 5)
              createExplosion(p.position, 0xa855f7, 12);
            }
            scene.remove(p);
            powerups.splice(i, 1);
          } else if (p.position.z > 8) {
            scene.remove(p);
            powerups.splice(i, 1);
          }
        }

        updateUI();
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
